<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadena de Bicicleta 3D - Sòlida i Articulada</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #030712;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 60%, #020617 100%);
    }
  </style>
</head>
<body>

  <canvas id="chainCanvas"></canvas>

  <script>
    const canvas = document.getElementById('chainCanvas');
    const ctx = canvas.getContext('2d');

    // ---------------------------------------------------------------
    // Paràmetres generals (responsius)
    // ---------------------------------------------------------------
    const NUM_LINKS = 24;
    let LINK_LENGTH = 45;
    let SPEED = 200;      // px/segon — velocitat de la baula tractora
    let GRAVITY = 700;    // px/segon^2 — acceleració de la bola

    let width = window.innerWidth;
    let height = window.innerHeight;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      const minDim = Math.min(width, height);
      LINK_LENGTH = Math.max(20, Math.min(45, minDim * 0.05));
      SPEED = Math.max(150, LINK_LENGTH * 4.5);
      GRAVITY = Math.max(500, minDim * 1.1);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ---------------------------------------------------------------
    // Cadena: estat i inicialització
    // ---------------------------------------------------------------
    const links = [];
    {
      const startX = width / 2;
      const startY = height / 2;
      for (let i = 0; i < NUM_LINKS; i++) {
        const x = startX - i * LINK_LENGTH;
        const y = startY;
        links.push({ x, y, prevX: x, prevY: y, angle: 0, ix: 0, iy: 0 });
      }
    }

    // Velocitat de la baula que en cada moment fa de tractora.
    // L'altre extrem no té velocitat pròpia: la cadena l'arrossega
    // (integració de Verlet), com un tram de corda o cadena real.
    let motorVX = SPEED * Math.SQRT1_2;
    let motorVY = SPEED * Math.SQRT1_2;

    // motorIsHead: quin extrem (0 = primera baula, NUM_LINKS-1 = última) tira ara.
    let motorIsHead = true;

    function swapTraction() {
      motorIsHead = !motorIsHead;
      // El nou extrem tractor arrenca en sentit contrari al que portava
      // l'anterior, conservant la velocitat.
      motorVX *= -1;
      motorVY *= -1;
    }

    function scheduleNextSwap() {
      const delay = 25000 + Math.random() * 10000; // entre 25 i 35 segons
      setTimeout(() => {
        swapTraction();
        scheduleNextSwap();
      }, delay);
    }
    scheduleNextSwap();

    // ---------------------------------------------------------------
    // Boles d'acer que cauen per gravetat i interfereixen amb la cadena.
    // Fins a MAX_BALLS coexistint alhora; quan una surt de pantalla es
    // treu de la llista i, passat un temps, en cau una altra — repetint-se
    // indefinidament.
    // ---------------------------------------------------------------
    let balls = [];
    const MAX_BALLS = 5;

    function spawnBall() {
      if (balls.length >= MAX_BALLS) return;
      const r = LINK_LENGTH * 0.6;
      balls.push({
        x: r + Math.random() * (width - 2 * r),
        y: -r * 2 - Math.random() * 200,
        vx: 0,
        vy: 0,
        r: r
      });
    }

    function scheduleNextBall() {
      const delay = 2500 + Math.random() * 3000; // entre 2.5 i 5.5 segons
      setTimeout(() => {
        spawnBall();
        scheduleNextBall();
      }, delay);
    }
    scheduleNextBall();

    function closestPointOnSegment(px, py, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const len2 = dx * dx + dy * dy || 1e-9;
      let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
      t = t < 0 ? 0 : (t > 1 ? 1 : t);
      return { x: a.x + dx * t, y: a.y + dy * t, t: t };
    }

    // Suma una velocitat d'impuls (px/s) a una baula concreta, que es
    // decaurà tota sola fotograma a fotograma (vegeu updatePhysics).
    // Això és el que fa que un cop de bola torci les baules implicades
    // i que la sacsejada es vagi propagant/esvaint per la cadena, en
    // lloc de corregir-se a l'instant.
    function applyImpulse(idx, vx, vy, weight, motorIdx) {
      if (idx < 0 || idx >= NUM_LINKS) return;
      if (idx === motorIdx) return; // la tractora té la seva pròpia gestió de rebot
      links[idx].ix += vx * weight;
      links[idx].iy += vy * weight;
    }

    // ---------------------------------------------------------------
    // Col·lisió pròpia segment-a-segment: es compara la distància més
    // curta entre TRAMS consecutius de cadena, no només els centres de
    // les baules, perquè cap part de la cadena en travessi una altra.
    // ---------------------------------------------------------------
    function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

    function closestSegSeg(p1, p2, p3, p4) {
      const d1x = p2.x - p1.x, d1y = p2.y - p1.y;
      const d2x = p4.x - p3.x, d2y = p4.y - p3.y;
      const rx = p1.x - p3.x, ry = p1.y - p3.y;
      const a = d1x * d1x + d1y * d1y;
      const e = d2x * d2x + d2y * d2y;
      const f = d2x * rx + d2y * ry;
      let s, t;

      if (a <= 1e-9 && e <= 1e-9) {
        s = 0; t = 0;
      } else if (a <= 1e-9) {
        s = 0; t = clamp01(f / e);
      } else {
        const c = d1x * rx + d1y * ry;
        if (e <= 1e-9) {
          t = 0; s = clamp01(-c / a);
        } else {
          const b = d1x * d2x + d1y * d2y;
          const denom = a * e - b * b;
          s = (denom !== 0) ? clamp01((b * f - c * e) / denom) : 0;
          t = (b * s + f) / e;
          if (t < 0) { t = 0; s = clamp01(-c / a); }
          else if (t > 1) { t = 1; s = clamp01((b - c) / a); }
        }
      }

      return {
        ax: p1.x + d1x * s, ay: p1.y + d1y * s,
        bx: p3.x + d2x * t, by: p3.y + d2y * t,
        s: s, t: t
      };
    }

    function resolveSelfCollisions(motorIdx) {
      const plateH = LINK_LENGTH * 0.55;
      const SEP = plateH * 0.85;
      const SEP2 = SEP * SEP;
      // El tram que conté la baula tractora es gestiona a part, a
      // handleMotorSelfImpact, perquè allà sí que ha de rebotar-hi de
      // manera realista en lloc de només empènyer l'altre tram.
      const motorSegmentIndex = (motorIdx === 0) ? 0 : NUM_LINKS - 2;

      for (let i = 0; i < NUM_LINKS - 1; i++) {
        if (i === motorSegmentIndex) continue;
        const a1 = links[i], a2 = links[i + 1];
        for (let j = i + 2; j < NUM_LINKS - 1; j++) {
          if (j === motorSegmentIndex) continue;
          const b1 = links[j], b2 = links[j + 1];
          const cp = closestSegSeg(a1, a2, b1, b2);
          const dx = cp.bx - cp.ax, dy = cp.by - cp.ay;
          const d2 = dx * dx + dy * dy;

          if (d2 < SEP2 && d2 > 1e-8) {
            const d = Math.sqrt(d2);
            const push = (SEP - d) / d;
            const ox = dx * push * 0.5, oy = dy * push * 0.5;
            const wa1 = 1 - cp.s, wa2 = cp.s;
            const wb1 = 1 - cp.t, wb2 = cp.t;

            a1.x -= ox * wa1; a1.y -= oy * wa1;
            a2.x -= ox * wa2; a2.y -= oy * wa2;
            b1.x += ox * wb1; b1.y += oy * wb1;
            b2.x += ox * wb2; b2.y += oy * wb2;
          }
        }
      }
    }

    // ---------------------------------------------------------------
    // La baula tractora rebota contra la resta de la cadena si hi
    // impacta, com faria un objecte sòlid real en topar contra si mateix
    // (a més del rebot que ja fa contra les cantonades de la pantalla).
    // ---------------------------------------------------------------
    function handleMotorSelfImpact(motorIdx) {
      const plateH = LINK_LENGTH * 0.55;
      const SEP = plateH * 0.85;
      const motor = links[motorIdx];

      for (let i = 0; i < NUM_LINKS - 1; i++) {
        // Ignorar el propi tram de la tractora i el tram immediatament
        // adjacent (és fisicament normal que hi estiguin a prop).
        if (motorIdx === 0 && i <= 1) continue;
        if (motorIdx === NUM_LINKS - 1 && i >= NUM_LINKS - 3) continue;

        const p1 = links[i], p2 = links[i + 1];
        const cp = closestPointOnSegment(motor.x, motor.y, p1, p2);
        const dx = motor.x - cp.x, dy = motor.y - cp.y;
        const dist = Math.hypot(dx, dy) || 0.0001;

        if (dist < SEP) {
          const nx = dx / dist, ny = dy / dist;
          const overlap = SEP - dist;

          // Treure la tractora del contacte
          motor.x += nx * overlap;
          motor.y += ny * overlap;

          // Rebot especular de la velocitat (com contra una paret sòlida)
          const vDotN = motorVX * nx + motorVY * ny;
          if (vDotN < 0) {
            motorVX -= 2 * vDotN * nx;
            motorVY -= 2 * vDotN * ny;
          }

          // El tram tocat cedeix una mica també
          const w1 = 1 - cp.t, w2 = cp.t;
          p1.x -= nx * overlap * 0.3 * w1; p1.y -= ny * overlap * 0.3 * w1;
          p2.x -= nx * overlap * 0.3 * w2; p2.y -= ny * overlap * 0.3 * w2;
        }
      }
    }

    // ---------------------------------------------------------------
    // Col·lisió de les boles contra la cadena
    // ---------------------------------------------------------------
    function updateBall(dt, motorIdx) {
      if (balls.length === 0) return;

      const linkRadius = LINK_LENGTH * 0.3;

      for (let bi = balls.length - 1; bi >= 0; bi--) {
        const ball = balls[bi];

        ball.vy += GRAVITY * dt;
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Rebot suau a les parets laterals
        if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * 0.5; }
        else if (ball.x + ball.r > width) { ball.x = width - ball.r; ball.vx = -Math.abs(ball.vx) * 0.5; }

        // Rebot al terra (perquè no desaparegui de seguida si cau a prop)
        if (ball.y + ball.r > height) {
          ball.y = height - ball.r;
          ball.vy = -Math.abs(ball.vy) * 0.35;
          ball.vx *= 0.85;
        }

        const minDist = ball.r + linkRadius;

        for (let i = 0; i < NUM_LINKS - 1; i++) {
          const p1 = links[i], p2 = links[i + 1];
          const cp = closestPointOnSegment(ball.x, ball.y, p1, p2);
          const dx = ball.x - cp.x, dy = ball.y - cp.y;
          const dist = Math.hypot(dx, dy) || 0.0001;

          if (dist < minDist) {
            const nx = dx / dist, ny = dy / dist;
            const overlap = minDist - dist;

            // Empènyer la bola cap enfora del contacte
            ball.x += nx * overlap * 0.6;
            ball.y += ny * overlap * 0.6;

            // Rebot de la bola (reflexió amortida de la velocitat)
            const vDotN = ball.vx * nx + ball.vy * ny;
            let impactSpeed = 0;
            if (vDotN < 0) {
              impactSpeed = -vDotN;
              ball.vx -= (1 + 0.4) * vDotN * nx;
              ball.vy -= (1 + 0.4) * vDotN * ny;
            }

            // Separació immediata perquè no es quedin superposades
            const w1 = (i === motorIdx) ? 0 : (1 - cp.t);
            const w2 = (i + 1 === motorIdx) ? 0 : cp.t;
            p1.x -= nx * overlap * 0.5 * w1; p1.y -= ny * overlap * 0.5 * w1;
            p2.x -= nx * overlap * 0.5 * w2; p2.y -= ny * overlap * 0.5 * w2;

            // Impuls físic: transmet part de la velocitat de la bola a la
            // baula (i les del voltant, amb menys força) com un cop real,
            // perquè es torcin i la sacsejada es propagui per la cadena
            // en lloc de corregir-se a l'instant.
            const TRANSFER = 0.9;
            applyImpulse(i, -nx * impactSpeed * TRANSFER, -ny * impactSpeed * TRANSFER, 1, motorIdx);
            applyImpulse(i + 1, -nx * impactSpeed * TRANSFER, -ny * impactSpeed * TRANSFER, 1, motorIdx);
            applyImpulse(i - 1, -nx * impactSpeed * TRANSFER, -ny * impactSpeed * TRANSFER, 0.45, motorIdx);
            applyImpulse(i + 2, -nx * impactSpeed * TRANSFER, -ny * impactSpeed * TRANSFER, 0.45, motorIdx);
            applyImpulse(i - 2, -nx * impactSpeed * TRANSFER, -ny * impactSpeed * TRANSFER, 0.2, motorIdx);
            applyImpulse(i + 3, -nx * impactSpeed * TRANSFER, -ny * impactSpeed * TRANSFER, 0.2, motorIdx);
          }
        }

        // Treure la bola quan surt clarament de pantalla per la part de sota
        if (ball.y - ball.r > height + 200) balls.splice(bi, 1);
      }
    }

    // ---------------------------------------------------------------
    // Solucionador físic: la tractora es mou i la resta de la cadena
    // simplement la SEGUEIX (projecció geomètrica directa, sense inèrcia
    // ni contraforça pròpies). Cap baula "estira" cap enrere ni oscil·la;
    // només hi ha una estrebada momentània quan canvia la tractora,
    // perquè en aquell instant la direcció de tracció s'inverteix de cop.
    // ---------------------------------------------------------------
    function updatePhysics(dt) {
      const margin = LINK_LENGTH;
      const motorIdx = motorIsHead ? 0 : NUM_LINKS - 1;

      // 1. Desplaçar únicament l'extrem tractor (píxels/segon * dt, per
      //    anar a la mateixa velocitat real en qualsevol dispositiu).
      const motor = links[motorIdx];
      motor.x += motorVX * dt;
      motor.y += motorVY * dt;

      if (motor.x + margin >= width) { motor.x = width - margin; motorVX = -Math.abs(motorVX); }
      else if (motor.x - margin <= 0) { motor.x = margin; motorVX = Math.abs(motorVX); }
      if (motor.y + margin >= height) { motor.y = height - margin; motorVY = -Math.abs(motorVY); }
      else if (motor.y - margin <= 0) { motor.y = margin; motorVY = Math.abs(motorVY); }

      // 1b. La tractora també rebota si topa contra la resta de la
      //     cadena (a més de contra les cantonades de la pantalla).
      handleMotorSelfImpact(motorIdx);

      // 2. Bola: cau per gravetat i pot desplaçar puntualment algun tram
      updateBall(dt, motorIdx);

      // 3. La resta de baules segueix la tractora amb una única projecció
      //    geomètrica (distància fixa respecte la baula anterior), en la
      //    direcció que correspongui segons quin extrem tira ara.
      if (motorIsHead) {
        for (let i = 1; i < NUM_LINKS; i++) {
          const dx = links[i].x - links[i - 1].x;
          const dy = links[i].y - links[i - 1].y;
          const dist = Math.hypot(dx, dy) || 0.001;
          const scale = LINK_LENGTH / dist;
          links[i].x = links[i - 1].x + dx * scale;
          links[i].y = links[i - 1].y + dy * scale;
        }
      } else {
        for (let i = NUM_LINKS - 2; i >= 0; i--) {
          const dx = links[i].x - links[i + 1].x;
          const dy = links[i].y - links[i + 1].y;
          const dist = Math.hypot(dx, dy) || 0.001;
          const scale = LINK_LENGTH / dist;
          links[i].x = links[i + 1].x + dx * scale;
          links[i].y = links[i + 1].y + dy * scale;
        }
      }

      // 4. Límit de flexió: pràcticament sense resistència pròpia — els
      //    eixos gairebé no fan de fre; només s'evita el plegament total
      //    sobre si mateixa (cosa que la col·lisió pròpia ja impedeix igualment).
      const MAX_ANGLE_DIFF = Math.PI * 0.92; // ~166°, marge mínim per evitar el cas degenerat de 180°
      if (motorIsHead) {
        for (let i = 1; i < NUM_LINKS - 1; i++) {
          let a1 = Math.atan2(links[i].y - links[i - 1].y, links[i].x - links[i - 1].x);
          let a2 = Math.atan2(links[i + 1].y - links[i].y, links[i + 1].x - links[i].x);
          let diff = a2 - a1;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          if (Math.abs(diff) > MAX_ANGLE_DIFF) {
            const targetAngle = a1 + Math.sign(diff) * MAX_ANGLE_DIFF;
            links[i + 1].x = links[i].x + Math.cos(targetAngle) * LINK_LENGTH;
            links[i + 1].y = links[i].y + Math.sin(targetAngle) * LINK_LENGTH;
          }
        }
      } else {
        for (let i = NUM_LINKS - 2; i > 0; i--) {
          let a1 = Math.atan2(links[i].y - links[i + 1].y, links[i].x - links[i + 1].x);
          let a2 = Math.atan2(links[i - 1].y - links[i].y, links[i - 1].x - links[i].x);
          let diff = a2 - a1;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          if (Math.abs(diff) > MAX_ANGLE_DIFF) {
            const targetAngle = a1 + Math.sign(diff) * MAX_ANGLE_DIFF;
            links[i - 1].x = links[i].x + Math.cos(targetAngle) * LINK_LENGTH;
            links[i - 1].y = links[i].y + Math.sin(targetAngle) * LINK_LENGTH;
          }
        }
      }

      // 5. Aplicar l'impuls acumulat (cops de bola) per sobre de la forma
      //    "ideal" de la cadena, i deixar-lo esvair tot sol. És el que fa
      //    que les baules colpejades es torcin i la sacsejada recorri la
      //    cadena físicament, en lloc de corregir-se a l'instant.
      const IMPULSE_DECAY = Math.pow(0.02, dt); // cau a ~2%/s (s'esvaeix en mig segon aprox.)
      for (let i = 0; i < NUM_LINKS; i++) {
        if (i === motorIdx) continue;
        links[i].x += links[i].ix * dt;
        links[i].y += links[i].iy * dt;
        links[i].ix *= IMPULSE_DECAY;
        links[i].iy *= IMPULSE_DECAY;
      }

      // 6. Cos sòlid: evitar que la cadena es travessi a si mateixa.
      //    Poques passades i suaus, perquè no generin cap vibració.
      resolveSelfCollisions(motorIdx);
      resolveSelfCollisions(motorIdx);

      // Orientació exacta de cada baula
      for (let i = 0; i < NUM_LINKS - 1; i++) {
        const dx = links[i + 1].x - links[i].x;
        const dy = links[i + 1].y - links[i].y;
        links[i].angle = Math.atan2(dy, dx);
      }
      links[NUM_LINKS - 1].angle = links[NUM_LINKS - 2].angle;
    }

    // ---------------------------------------------------------------
    // Render
    // ---------------------------------------------------------------
    function drawLinkShape(length, height) {
      const r = height / 2;
      const waist = height * 0.55;

      ctx.beginPath();
      ctx.arc(0, 0, r, Math.PI * 0.5, Math.PI * 1.5);
      ctx.quadraticCurveTo(length / 2, -waist / 2, length, -r);
      ctx.arc(length, 0, r, Math.PI * 1.5, Math.PI * 0.5);
      ctx.quadraticCurveTo(length / 2, waist / 2, 0, r);
      ctx.closePath();
    }

    function drawBall(ball) {
      ctx.save();
      ctx.translate(ball.x, ball.y);

      // Aspecte d'acer polit (com els rodets de la cadena), no vermell
      const g = ctx.createRadialGradient(-ball.r * 0.3, -ball.r * 0.35, ball.r * 0.1, 0, 0, ball.r);
      g.addColorStop(0, '#f8fafc');
      g.addColorStop(0.35, '#cbd5e1');
      g.addColorStop(0.7, '#64748b');
      g.addColorStop(1, '#1e293b');

      ctx.beginPath();
      ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.lineWidth = Math.max(1, ball.r * 0.06);
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(-ball.r * 0.35, -ball.r * 0.4, ball.r * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fill();

      ctx.restore();
    }

    function drawChain() {
      ctx.clearRect(0, 0, width, height);

      // Perspectiva 3D lateral de 20°
      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.scale(1.0, 0.9396); // cos(20°) ≈ 0.9396
      ctx.rotate(0.04);
      ctx.translate(-width / 2, -height / 2);

      // Quadrícula de fons
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const gridSize = 60;
      for (let x = -100; x < width + 100; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, -100); ctx.lineTo(x, height + 100); ctx.stroke();
      }
      for (let y = -100; y < height + 100; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(-100, y); ctx.lineTo(width + 100, y); ctx.stroke();
      }

      const plateW = LINK_LENGTH;
      const plateH = LINK_LENGTH * 0.55;

      // 1. OMBRES PROJECTADES 3D
      for (let i = NUM_LINKS - 2; i >= 0; i--) {
        const link = links[i];
        ctx.save();
        ctx.translate(link.x + 8, link.y + 14);
        ctx.rotate(link.angle);
        ctx.fillStyle = 'rgba(2, 6, 23, 0.55)';
        drawLinkShape(plateW, plateH);
        ctx.fill();
        ctx.restore();
      }

      // 2. RODETS I PLAQUES INTERIORS
      for (let i = NUM_LINKS - 2; i >= 0; i--) {
        const link = links[i];
        const isOuter = (i % 2 === 0);

        ctx.save();
        ctx.translate(link.x, link.y);
        ctx.rotate(link.angle);

        const rollerR = plateH * 0.38;
        const gradRoller = ctx.createRadialGradient(-rollerR * 0.2, -rollerR * 0.2, 1, 0, 0, rollerR);
        gradRoller.addColorStop(0, '#cbd5e1');
        gradRoller.addColorStop(0.5, '#475569');
        gradRoller.addColorStop(1, '#0f172a');
        ctx.fillStyle = gradRoller;
        ctx.beginPath(); ctx.arc(0, 0, rollerR, 0, Math.PI * 2); ctx.fill();

        if (!isOuter) {
          const gradInner = ctx.createLinearGradient(0, -plateH / 2, 0, plateH / 2);
          gradInner.addColorStop(0, '#64748b');
          gradInner.addColorStop(0.5, '#334155');
          gradInner.addColorStop(1, '#0f172a');
          ctx.fillStyle = gradInner;
          ctx.strokeStyle = '#020617';
          ctx.lineWidth = 1.5;
          drawLinkShape(plateW, plateH);
          ctx.fill(); ctx.stroke();
        }

        ctx.restore();
      }

      // 3. PLAQUES EXTERIORS CROMADES I PERNS
      for (let i = NUM_LINKS - 2; i >= 0; i--) {
        const link = links[i];
        const isOuter = (i % 2 === 0);

        ctx.save();
        ctx.translate(link.x, link.y);
        ctx.rotate(link.angle);

        if (isOuter) {
          const gradOuter = ctx.createLinearGradient(0, -plateH / 2, 0, plateH / 2);
          gradOuter.addColorStop(0, '#ffffff');
          gradOuter.addColorStop(0.2, '#e2e8f0');
          gradOuter.addColorStop(0.6, '#64748b');
          gradOuter.addColorStop(1, '#1e293b');
          ctx.fillStyle = gradOuter;
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 2;
          drawLinkShape(plateW, plateH);
          ctx.fill(); ctx.stroke();
        }

        const pinR = plateH * 0.22;
        const gradPin = ctx.createRadialGradient(-pinR * 0.3, -pinR * 0.3, 1, 0, 0, pinR);
        gradPin.addColorStop(0, '#ffffff');
        gradPin.addColorStop(0.5, '#94a3b8');
        gradPin.addColorStop(1, '#020617');
        ctx.fillStyle = gradPin;
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, pinR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#090d16';
        ctx.beginPath(); ctx.arc(0, 0, pinR * 0.45, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
      }

      // 4. Bola (dins la mateixa perspectiva 3D, per si la cadena la tapa/destapa bé)
      for (const b of balls) drawBall(b);

      // 5 i 6. LEDS ALS EXTREMS: el verd sempre acompanya la baula tractora.
      function drawLED(link, rgb) {
        ctx.save();
        ctx.translate(link.x, link.y);
        const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, plateH * 0.9);
        grad.addColorStop(0, `rgba(${rgb}, 1)`);
        grad.addColorStop(0.5, `rgba(${rgb}, 0.4)`);
        grad.addColorStop(1, `rgba(${rgb}, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, plateH * 0.9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, plateH * 0.16, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      const GREEN = '34, 197, 94';
      const RED = '239, 68, 68';

      drawLED(links[0], motorIsHead ? GREEN : RED);
      drawLED(links[NUM_LINKS - 1], motorIsHead ? RED : GREEN);

      ctx.restore(); // Fi transformació 3D
    }

    // ---------------------------------------------------------------
    // Bucle principal (basat en temps real, no en fotogrames)
    // ---------------------------------------------------------------
    let lastTimestamp = null;

    function loop(timestamp) {
      if (lastTimestamp === null) lastTimestamp = timestamp;
      const dt = Math.min(0.033, (timestamp - lastTimestamp) / 1000);
      lastTimestamp = timestamp;

      updatePhysics(dt);
      drawChain();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
