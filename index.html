<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadena de Bicicleta 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #030712;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 60%, #020617 100%);
    }
  </style>
</head>
<body>

  <canvas id="chainCanvas"></canvas>

  <script>
    const canvas = document.getElementById('chainCanvas');
    const ctx = canvas.getContext('2d');

    const NUM_LINKS = 18;
    let LINK_LENGTH = 80; 
    let SPEED = 7;

    let width = window.innerWidth;
    let height = window.innerHeight;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      const minDim = Math.min(width, height);
      LINK_LENGTH = Math.max(50, Math.min(90, minDim * 0.08));
      SPEED = Math.max(5, LINK_LENGTH * 0.1);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Direcció inicial
    let vx = SPEED * Math.SQRT1_2;
    let vy = SPEED * Math.SQRT1_2;

    const links = [];
    const startX = width / 2;
    const startY = height / 2;

    for (let i = 0; i < NUM_LINKS; i++) {
      links.push({
        x: startX - i * LINK_LENGTH,
        y: startY,
        angle: 0
      });
    }

    function updatePhysics() {
      // Avançar el cap
      links[0].x += vx;
      links[0].y += vy;

      const margin = LINK_LENGTH;

      // Rebots a les parets
      if (links[0].x + margin >= width) {
        links[0].x = width - margin;
        vx = -Math.abs(vx);
      } else if (links[0].x - margin <= 0) {
        links[0].x = margin;
        vx = Math.abs(vx);
      }

      if (links[0].y + margin >= height) {
        links[0].y = height - margin;
        vy = -Math.abs(vy);
      } else if (links[0].y - margin <= 0) {
        links[0].y = margin;
        vy = Math.abs(vy);
      }

      // Restricció de cinemàtica inversa estable (Inverse Kinematics)
      for (let i = 1; i < NUM_LINKS; i++) {
        const dx = links[i - 1].x - links[i].x;
        const dy = links[i - 1].y - links[i].y;
        const dist = Math.hypot(dx, dy) || 0.001;

        links[i].angle = Math.atan2(dy, dx);
        
        // Mantenir la distància rígidament igual a LINK_LENGTH
        links[i].x = links[i - 1].x - Math.cos(links[i].angle) * LINK_LENGTH;
        links[i].y = links[i - 1].y - Math.sin(links[i].angle) * LINK_LENGTH;
      }
    }

    // Geometria en forma d'os/baula de bicicleta realista (amb centre a 0,0)
    function drawLinkShape(length, height) {
      const r = height / 2;
      const waist = height * 0.55;

      ctx.beginPath();
      ctx.arc(0, 0, r, Math.PI * 0.5, Math.PI * 1.5);
      ctx.quadraticCurveTo(length / 2, -waist / 2, length, -r);
      ctx.arc(length, 0, r, Math.PI * 1.5, Math.PI * 0.5);
      ctx.quadraticCurveTo(length / 2, waist / 2, 0, r);
      ctx.closePath();
    }

    function drawChain() {
      ctx.clearRect(0, 0, width, height);

      // 1. Quadrícula fons subtil
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const gridSize = 60;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }

      const plateW = LINK_LENGTH;
      const plateH = LINK_LENGTH * 0.55;

      // 2. OMBRES PROJECTADES EN 3D
      for (let i = NUM_LINKS - 1; i >= 0; i--) {
        const link = links[i];
        ctx.save();
        ctx.translate(link.x + 12, link.y + 16);
        ctx.rotate(link.angle);
        ctx.fillStyle = 'rgba(2, 6, 23, 0.5)';
        drawLinkShape(plateW, plateH);
        ctx.fill();
        ctx.restore();
      }

      // 3. CAPA INFERIOR: Rodets i Plaques Interiors
      for (let i = NUM_LINKS - 1; i >= 0; i--) {
        const link = links[i];
        const isOuter = (i % 2 === 0);

        ctx.save();
        ctx.translate(link.x, link.y);
        ctx.rotate(link.angle);

        // Rodet central
        const rollerR = plateH * 0.38;
        const gradRoller = ctx.createRadialGradient(-rollerR*0.2, -rollerR*0.2, 1, 0, 0, rollerR);
        gradRoller.addColorStop(0, '#cbd5e1');
        gradRoller.addColorStop(0.5, '#475569');
        gradRoller.addColorStop(1, '#0f172a');
        
        ctx.fillStyle = gradRoller;
        ctx.beginPath(); ctx.arc(0, 0, rollerR, 0, Math.PI * 2); ctx.fill();

        // Placa Interior (Acer fosquet)
        if (!isOuter) {
          const gradInner = ctx.createLinearGradient(0, -plateH/2, 0, plateH/2);
          gradInner.addColorStop(0, '#64748b');
          gradInner.addColorStop(0.5, '#334155');
          gradInner.addColorStop(1, '#0f172a');

          ctx.fillStyle = gradInner;
          ctx.strokeStyle = '#020617';
          ctx.lineWidth = 1.5;

          drawLinkShape(plateW, plateH);
          ctx.fill();
          ctx.stroke();
        }

        ctx.restore();
      }

      // 4. CAPA SUPERIOR: Plaques Exteriors Cromades + Eixos Rivetats
      for (let i = NUM_LINKS - 1; i >= 0; i--) {
        const link = links[i];
        const isOuter = (i % 2 === 0);

        ctx.save();
        ctx.translate(link.x, link.y);
        ctx.rotate(link.angle);

        if (isOuter) {
          // Extrusió cromada brillant
          const gradOuter = ctx.createLinearGradient(0, -plateH/2, 0, plateH/2);
          gradOuter.addColorStop(0, '#ffffff');
          gradOuter.addColorStop(0.2, '#e2e8f0');
          gradOuter.addColorStop(0.6, '#64748b');
          gradOuter.addColorStop(1, '#1e293b');

          ctx.fillStyle = gradOuter;
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 2;

          drawLinkShape(plateW, plateH);
          ctx.fill();
          ctx.stroke();
        }

        // PERNS / PINS D'ARTICULACIÓ EN TOTS ELS NIVELLS
        const pinR = plateH * 0.22;
        const gradPin = ctx.createRadialGradient(-pinR*0.3, -pinR*0.3, 1, 0, 0, pinR);
        gradPin.addColorStop(0, '#ffffff');
        gradPin.addColorStop(0.5, '#94a3b8');
        gradPin.addColorStop(1, '#020617');

        ctx.fillStyle = gradPin;
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;

        ctx.beginPath(); ctx.arc(0, 0, pinR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // Forat interior del rivet
        ctx.fillStyle = '#090d16';
        ctx.beginPath(); ctx.arc(0, 0, pinR * 0.45, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
      }

      // 5. LED Vermell d'alta intensitat al cap
      const head = links[0];
      ctx.save();
      ctx.translate(head.x, head.y);
      
      const gradGlow = ctx.createRadialGradient(0, 0, 2, 0, 0, 20);
      gradGlow.addColorStop(0, 'rgba(239, 68, 68, 1)');
      gradGlow.addColorStop(0.5, 'rgba(239, 68, 68, 0.4)');
      gradGlow.addColorStop(1, 'rgba(239, 68, 68, 0)');

      ctx.fillStyle = gradGlow;
      ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();

      ctx.restore();
    }

    function loop() {
      updatePhysics();
      drawChain();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
