<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Gargot a traç</title>
<style>
  :root{
    --bg:#efe9dd; --card:#fffdf8; --ink:#22304a; --muted:#6b7385; --accent:#0f766e;
    --line:#d9d0bd; --btn:#22304a; --btn-fg:#fffdf8;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  main{max-width:1000px;margin:0 auto;display:grid;gap:12px}
  h1{font-size:1.15rem;margin:0;font-weight:650;letter-spacing:.01em}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar .grow{flex:1 1 auto}
  select,button{
    font:inherit; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:9px 12px; min-height:42px;
  }
  button{cursor:pointer}
  button.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
  button:disabled{opacity:.45;cursor:default}
  button:active:not(:disabled){transform:translateY(1px)}
  label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.9rem}
  .temp{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
  .temp input{width:110px}
  .status{min-height:1.4em;color:var(--muted);font-size:.95rem}
  .status.err{color:#b42318}
  .boards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .card h2{margin:2px 6px 6px;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .board{
    position:relative; width:100%; aspect-ratio:4/3; border-radius:10px; overflow:hidden;
    background-color:#fffefb;
    background-image:radial-gradient(circle,#e6dfcd 1px,transparent 1.2px);
    background-size:22px 22px;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #paper{touch-action:none;cursor:crosshair}
  .hint{position:absolute;inset:0;display:grid;place-items:center;color:#a39b86;font-size:1rem;pointer-events:none;text-align:center;padding:16px}
  .hint[hidden]{display:none}
  .spin{position:absolute;right:10px;top:10px;width:18px;height:18px;border-radius:50%;
    border:2.5px solid #d9d0bd;border-top-color:var(--accent);animation:sp .8s linear infinite;display:none}
  .busy .spin{display:block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main>
  <h1>Gargot a traç net</h1>

  <div class="bar">
    <select id="cat" aria-label="Què dibuixes?"></select>
    <button id="undo" type="button">Desfés</button>
    <button id="clear" type="button">Neteja</button>
    <span class="grow"></span>
    <button id="again" class="primary" type="button" disabled>Un altre intent</button>
  </div>

  <div class="bar">
    <label class="temp">Llibertat de la IA
      <input id="temp" type="range" min="0.1" max="0.9" step="0.05" value="0.3">
    </label>
    <label class="chk"><input id="tint" type="checkbox" checked> Marca el que afegeix la IA</label>
  </div>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <div class="boards">
    <section class="card">
      <h2>El teu gargot</h2>
      <div class="board" id="paperBoard">
        <canvas id="paper"></canvas>
        <div class="hint" id="hint">Dibuixa amb el dit i espera un moment</div>
      </div>
    </section>
    <section class="card">
      <h2>Traç net</h2>
      <div class="board" id="outBoard">
        <canvas id="out"></canvas>
        <div class="spin"></div>
      </div>
    </section>
  </div>

  <div class="foot">Model sketch-rnn (Magenta) entrenat amb dibuixos de Quick, Draw!. Funciona al navegador; només cal connexió per baixar el model la primera vegada.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@magenta/sketch@0.2.0/dist/magentasketch.js"></script>
<script>
(() => {
'use strict';

// ---------- Configuració ----------
const MODEL_BASE = 'https://storage.googleapis.com/quickdraw-models/sketchRNN/models/';
const CATEGORIES = [
  ['duck','Ànec'], ['cat','Gat'], ['dog','Gos'], ['bird','Ocell'], ['swan','Cigne'],
  ['owl','Mussol'], ['pig','Porc'], ['sheep','Ovella'], ['frog','Granota'], ['snail','Caragol'],
  ['butterfly','Papallona'], ['whale','Balena'], ['flower','Flor'], ['palm_tree','Palmera'],
  ['speedboat','Llanxa'], ['cruise_ship','Creuer'], ['lighthouse','Far'], ['windmill','Molí'],
  ['barn','Graner'], ['castle','Castell'], ['bicycle','Bicicleta'], ['bus','Autobús'],
  ['truck','Camió'], ['helicopter','Helicòpter']
];
const MODEL_SPAN = 200;     // mida (en unitats Quick, Draw!) a la qual s'escala el gargot
const MAX_STEPS  = 260;     // límit de punts que pot afegir el model
const IDLE_MS    = 1400;    // pausa sense tocar abans de generar

// ---------- DOM ----------
const $ = s => document.querySelector(s);
const paper = $('#paper'), out = $('#out');
const catSel = $('#cat'), tempEl = $('#temp'), tintEl = $('#tint');
const undoBtn = $('#undo'), clearBtn = $('#clear'), againBtn = $('#again');
const statusEl = $('#status'), hintEl = $('#hint'), outBoard = $('#outBoard');

for (const [id, name] of CATEGORIES) {
  const o = document.createElement('option'); o.value = id; o.textContent = name; catSel.appendChild(o);
}

// ---------- Estat ----------
let W = 0, H = 0;           // mida CSS dels canvas
let lines = [];             // gargot: llistes de [x/W, y/W] (independent de la mida)
let drawing = null;         // traç en curs
let idleTimer = 0;
let genId = 0;              // invalida generacions antigues
let anim = 0;               // id de requestAnimationFrame
let result = null;          // { user: [[x,y]...], added: [[x,y]...] } en unitats del model
const models = new Map();

const INK = '#22304a', AI = '#0f766e';

function setStatus(msg, err) { statusEl.textContent = msg || ''; statusEl.classList.toggle('err', !!err); }
function setBusy(b) { outBoard.classList.toggle('busy', b); }

// ---------- Canvas ----------
function fit() {
  const r = paper.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  for (const c of [paper, out]) {
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  redrawPaper();
  if (result) drawResult(1);
}

function strokePath(ctx, pts) {
  if (!pts.length) return;
  if (pts.length === 1) {
    ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); return;
  }
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  const l = pts[pts.length - 1]; ctx.lineTo(l[0], l[1]); ctx.stroke();
}

function redrawPaper() {
  const ctx = paper.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const l of lines) strokePath(ctx, l.map(p => [p[0] * W, p[1] * W]));
  hintEl.hidden = lines.length > 0;
}

// ---------- Entrada amb el dit / ratolí ----------
function pt(e) {
  const r = paper.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width), y = (e.clientY - r.top) * (H / r.height);
  return [x / W, y / W];
}

paper.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  paper.setPointerCapture(e.pointerId);
  clearTimeout(idleTimer); genId++; stopAnim(); setBusy(false);
  drawing = [pt(e)]; lines.push(drawing);
  redrawPaper();
});
paper.addEventListener('pointermove', e => {
  if (!drawing) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) {
    const p = pt(ev), q = drawing[drawing.length - 1];
    if (Math.hypot((p[0] - q[0]) * W, (p[1] - q[1]) * W) >= 1.5) drawing.push(p);
  }
  redrawPaper();
});
function endStroke(e) {
  if (!drawing) return;
  const d = drawing; drawing = null;
  let len = 0; for (let i = 1; i < d.length; i++) len += Math.hypot((d[i][0] - d[i - 1][0]) * W, (d[i][1] - d[i - 1][1]) * W);
  if (len < 8) lines.splice(lines.indexOf(d), 1);   // un toc accidental no compta
  redrawPaper();
  scheduleGenerate();
}
paper.addEventListener('pointerup', endStroke);
paper.addEventListener('pointercancel', endStroke);
paper.addEventListener('contextmenu', e => e.preventDefault());

function scheduleGenerate() {
  clearTimeout(idleTimer);
  if (!lines.length) { clearResult(); setStatus('Dibuixa alguna cosa amb el dit.'); return; }
  setStatus('Sembla que has acabat… (segueix dibuixant si vols)');
  idleTimer = setTimeout(generate, IDLE_MS);
}

// ---------- Model ----------
function loadModel(name) {
  if (models.has(name)) return models.get(name);
  if (typeof ms === 'undefined' || !ms.SketchRNN) {
    return Promise.reject(new Error('No s\'ha pogut carregar la llibreria de Magenta.'));
  }
  const m = new ms.SketchRNN(MODEL_BASE + name + '.gen.json');
  const p = m.initialize().then(() => { m.setPixelFactor(1.0); return m; });
  models.set(name, p);
  p.catch(() => models.delete(name));
  return p;
}
const catName = id => (CATEGORIES.find(c => c[0] === id) || [, id])[1].toLowerCase();
const tick = () => new Promise(r => setTimeout(r, 0));

// Suavitzat de cantonades (Chaikin) per a una polilínia oberta, conservant els extrems
function chaikin(pts, iters) {
  let p = pts;
  for (let k = 0; k < iters && p.length > 2; k++) {
    const q = [p[0]];
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1];
      q.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]);
    }
    q.push(p[p.length - 1]); p = q;
  }
  return p;
}

async function generate() {
  clearTimeout(idleTimer);
  if (!lines.length) return;
  const my = ++genId;
  stopAnim();
  const id = catSel.value;

  setBusy(true); againBtn.disabled = true;
  let model;
  try {
    setStatus(models.has(id) ? 'Pensant…' : 'Baixant el model (' + catName(id) + ')…');
    model = await loadModel(id);
  } catch (err) {
    if (my === genId) { setBusy(false); setStatus('No s\'ha pogut carregar el model (cal connexió a internet). ' + (err && err.message || ''), true); }
    return;
  }
  if (my !== genId) return;
  setStatus('Pensant…');
  await tick();

  try {
    // 1) Gargot -> unitats del model (caixa de MODEL_SPAN)
    const px = lines.map(l => l.map(p => [p[0] * W, p[1] * W])).filter(l => l.length > 1);
    if (!px.length) { setBusy(false); return; }
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const l of px) for (const p of l) { minx = Math.min(minx, p[0]); miny = Math.min(miny, p[1]); maxx = Math.max(maxx, p[0]); maxy = Math.max(maxy, p[1]); }
    const S = MODEL_SPAN / Math.max(maxx - minx, maxy - miny, 20);
    const scaled = px.map(l => l.map(p => [(p[0] - minx) * S, (p[1] - miny) * S]));
    const simp = model.simplifyLines(scaled, 2.0).filter(l => l.length > 1);
    if (!simp.length) { setBusy(false); return; }

    // 2) Alimentem el model amb el gargot
    const strokes = model.linesToStroke(simp);
    strokes.pop();                                   // traiem el "fi de dibuix": continuarem
    let state = model.zeroState();
    state = model.update(model.zeroInput(), state);
    if (strokes.length) state = model.updateStrokes(strokes, state);
    const last = simp[simp.length - 1][simp[simp.length - 1].length - 1];
    let x = last[0], y = last[1];

    // 3) El model continua el dibuix
    const temp = parseFloat(tempEl.value);
    const added = [];
    let cur = null, down = false;
    for (let i = 0; i < MAX_STEPS; i++) {
      const pdf = model.getPDF(state, temp);
      const s = model.sample(pdf);
      state = model.update(s, state);
      const nx = x + s[0], ny = y + s[1];
      if (down) {
        if (!cur) { cur = [[x, y]]; added.push(cur); }
        cur.push([nx, ny]);
      } else cur = null;
      x = nx; y = ny;
      down = s[2] === 1;
      if (s[3] === 1) cur = null;
      if (s[4] === 1) break;
      if (i % 12 === 11) { await tick(); if (my !== genId) return; }
    }
    if (my !== genId) return;

    // 4) Netegem: suavitzat suau del gargot i del que afegeix el model
    const userClean = simp.map(l => chaikin(model.simplifyLine(l, 1.2), 3));
    const addedClean = added.filter(l => l.length > 1).map(l => chaikin(l, 2));
    result = { user: userClean, added: addedClean };
    setBusy(false); againBtn.disabled = false;
    setStatus('Fet. Toca «Un altre intent» per veure una altra variant.');
    startAnim();
  } catch (err) {
    console.error(err);
    if (my === genId) { setBusy(false); setStatus('Error generant el dibuix: ' + (err && err.message || err), true); }
  }
}

// ---------- Resultat ----------
function clearResult() {
  genId++; stopAnim(); result = null; setBusy(false); againBtn.disabled = true;
  out.getContext('2d').clearRect(0, 0, W, H);
}
function stopAnim() { if (anim) cancelAnimationFrame(anim); anim = 0; }

function polyLen(l) { let s = 0; for (let i = 1; i < l.length; i++) s += Math.hypot(l[i][0] - l[i - 1][0], l[i][1] - l[i - 1][1]); return s; }

function drawResult(t) {                        // t = 0..1 (progrés de l'animació)
  if (!result) return;
  const all = result.user.concat(result.added);
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (const l of all) for (const p of l) { minx = Math.min(minx, p[0]); miny = Math.min(miny, p[1]); maxx = Math.max(maxx, p[0]); maxy = Math.max(maxy, p[1]); }
  const m = 0.09, bw = Math.max(maxx - minx, 1), bh = Math.max(maxy - miny, 1);
  const k = Math.min(W * (1 - 2 * m) / bw, H * (1 - 2 * m) / bh);
  const ox = (W - bw * k) / 2 - minx * k, oy = (H - bh * k) / 2 - miny * k;
  const tr = l => l.map(p => [p[0] * k + ox, p[1] * k + oy]);

  const ctx = out.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3.5, Math.min(W, H) / 70);

  const total = all.reduce((s, l) => s + polyLen(l), 0) || 1;
  let budget = t * total;
  const nUser = result.user.length;
  for (let i = 0; i < all.length && budget > 0; i++) {
    const l = tr(all[i]), L = polyLen(l);
    const col = (tintEl.checked && i >= nUser) ? AI : INK;
    ctx.strokeStyle = col; ctx.fillStyle = col;
    if (budget >= L - 1e-6) { strokePath(ctx, l); budget -= L; continue; }
    // traç parcial
    const part = [l[0]]; let acc = 0;
    for (let j = 1; j < l.length; j++) {
      const d = Math.hypot(l[j][0] - l[j - 1][0], l[j][1] - l[j - 1][1]);
      if (acc + d >= budget) { const f = (budget - acc) / (d || 1); part.push([l[j - 1][0] + (l[j][0] - l[j - 1][0]) * f, l[j - 1][1] + (l[j][1] - l[j - 1][1]) * f]); break; }
      part.push(l[j]); acc += d;
    }
    strokePath(ctx, part); budget = 0;
  }
}

function startAnim() {
  stopAnim();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { drawResult(1); return; }
  const dur = 2200, t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    drawResult(1 - Math.pow(1 - t, 2));          // ease-out
    anim = t < 1 ? requestAnimationFrame(step) : 0;
  };
  anim = requestAnimationFrame(step);
}

// ---------- Botons ----------
undoBtn.addEventListener('click', () => { lines.pop(); redrawPaper(); scheduleGenerate(); });
clearBtn.addEventListener('click', () => { clearTimeout(idleTimer); lines = []; redrawPaper(); clearResult(); setStatus('Dibuixa alguna cosa amb el dit.'); });
againBtn.addEventListener('click', generate);
tintEl.addEventListener('change', () => { if (result) drawResult(1); });
catSel.addEventListener('change', () => {
  const id = catSel.value;
  if (lines.length) { generate(); }
  else { setStatus('Baixant el model (' + catName(id) + ')…'); loadModel(id).then(() => { if (!lines.length) setStatus('Model llest (' + catName(id) + '). Dibuixa!'); }).catch(() => setStatus('No s\'ha pogut carregar el model (cal connexió a internet).', true)); }
});
tempEl.addEventListener('change', () => { if (lines.length && result) generate(); });

window.addEventListener('resize', fit);
fit();
setStatus('Baixant el model (' + catName(catSel.value) + ')…');
loadModel(catSel.value)
  .then(() => { if (!lines.length) setStatus('Model llest (' + catName(catSel.value) + '). Dibuixa!'); })
  .catch(err => setStatus('No s\'ha pogut carregar el model (cal connexió a internet). ' + (err && err.message || ''), true));
})();
</script>
</body>
</html>
