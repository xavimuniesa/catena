<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rellotge de Pèndol Vintage</title>
    <style>
        /* --- ESTILS GENERALS I VARIABLES D'AMBIENT --- */
        :root {
            --bg-color: #1a3a32; /* Verd fosc com la paret de la foto */
            --wood-dark: #3b1f0b;
            --wood-light: #6b3e1b;
            --brass: #d4af37;
            --brass-dark: #997a00;
            --text-color: #f0e6d2;
            --panel-bg: rgba(20, 30, 25, 0.85);
            --shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        body.night {
            --bg-color: #0a1412;
            --wood-dark: #1a0f05;
            --wood-light: #2a180a;
            --brass: #8a7020;
            --brass-dark: #5a4a10;
            --text-color: #a0a0a0;
            --panel-bg: rgba(0, 0, 0, 0.9);
            --shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 2s ease;
            /* Aquí pots posar la teva imatge de fons: background-image: url('la_teva_foto.jpg'); background-size: cover; */
        }

        /* --- CONTENIDOR PRINCIPAL DEL RELLOTGE --- */
        .clock-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5vh;
            filter: drop-shadow(var(--shadow));
            transition: filter 2s ease;
        }

        /* --- COSSA DEL RELLOTGE (FUSTA) --- */
        .clock-body {
            position: relative;
            width: 85%;
            height: 60%;
            background: linear-gradient(135deg, var(--wood-light), var(--wood-dark));
            border-radius: 40px 40px 10px 10px;
            border: 4px solid var(--wood-dark);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            z-index: 2;
        }

        /* --- ESCUT SUPERIOR (MAPA) --- */
        .crest {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, var(--brass), var(--brass-dark));
            border-radius: 50%;
            border: 2px solid var(--wood-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #222;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            margin-bottom: 10px;
        }

        /* --- ESFERA DEL RELLOTGE --- */
        .clock-face {
            position: relative;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #e8d8b0, #c4a46c);
            border-radius: 50%;
            border: 6px solid var(--brass);
            box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Números romans simulats amb CSS */
        .roman-numeral {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            color: #222;
            font-family: 'Times New Roman', serif;
        }

        /* Agulles */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            transition: transform 0.1s cubic-bezier(0.4, 2.5, 0.6, 0.5);
        }
        .hour-hand {
            width: 6px;
            height: 50px;
            background: #111;
            transform: translateX(-50%) rotate(0deg);
            z-index: 5;
        }
        .minute-hand {
            width: 4px;
            height: 70px;
            background: #111;
            transform: translateX(-50%) rotate(0deg);
            z-index: 6;
        }
        .center-pin {
            width: 12px;
            height: 12px;
            background: var(--brass);
            border-radius: 50%;
            position: absolute;
            z-index: 7;
            border: 2px solid #111;
        }

        /* --- PÈNDOL I PESOS --- */
        .pendulum-area {
            position: relative;
            width: 60%;
            height: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -10px;
            z-index: 1;
        }

        .pendulum-rod {
            width: 4px;
            height: 120px;
            background: linear-gradient(to right, var(--brass-dark), var(--brass), var(--brass-dark));
            position: relative;
            transform-origin: top center;
            animation: swing 2s ease-in-out infinite alternate;
            margin-top: -20px;
        }

        .pendulum-bob {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, var(--brass), var(--brass-dark));
            border-radius: 50%;
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            border: 2px solid #553d00;
        }

        .weights-container {
            display: flex;
            gap: 40px;
            margin-top: 20px;
            position: relative;
        }

        .weight {
            width: 25px;
            height: 100px;
            background: linear-gradient(to right, var(--brass-dark), var(--brass), var(--brass-dark));
            border-radius: 5px 5px 2px 2px;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.6);
            position: relative;
            cursor: grab;
            transition: transform 0.1s;
        }
        .weight:active {
            cursor: grabbing;
        }
        .weight::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: var(--brass-dark);
            border-radius: 50%;
        }

        /* --- CONTROLS I BARRA DE CLIMA --- */
        .controls {
            position: absolute;
            bottom: 10px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .btn {
            background: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--brass);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        .btn:active {
            transform: scale(0.95);
            background: var(--brass);
            color: #000;
        }

        /* Barra lliscant (Bottom Sheet) */
        .weather-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 250px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-top: 2px solid var(--brass);
            border-radius: 20px 20px 0 0;
            transform: translateY(210px); /* Amagat parcialment */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            touch-action: none;
        }

        .weather-sheet.open {
            transform: translateY(0);
        }

        .drag-handle {
            width: 50px;
            height: 5px;
            background: var(--brass);
            border-radius: 5px;
            margin-bottom: 15px;
            cursor: grab;
        }

        .weather-content {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            color: var(--text-color);
            font-size: 13px;
            padding: 0 15px;
        }

        .weather-item {
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 8px;
            border-left: 3px solid var(--brass);
        }

        .weather-item span:first-child {
            font-size: 10px;
            opacity: 0.7;
        }
        .weather-item span:last-child {
            font-size: 14px;
            font-weight: bold;
        }

        .alert-box {
            grid-column: span 2;
            background: rgba(200, 50, 50, 0.3);
            border: 1px solid #ff4444;
            color: #ffcccc;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            display: none; /* S'amaga si no hi ha alertes */
        }

        /* --- ANIMACIONS --- */
        @keyframes swing {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }

        /* --- RESPONSIVE (Escriptori) --- */
        @media (min-width: 768px) {
            .clock-container {
                max-width: 450px;
            }
            .clock-face {
                width: 220px;
                height: 220px;
            }
            .hour-hand { height: 60px; }
            .minute-hand { height: 85px; }
            .weather-sheet {
                transform: translateY(220px);
            }
        }
    </style>
</head>
<body>

    <div class="clock-container" id="clockContainer">
        <!-- Cos del rellotge -->
        <div class="clock-body">
            <div class="crest">TEMPUS<br>FUGIT</div>
            
            <div class="clock-face" id="clockFace">
                <!-- Els números es generaran amb JS -->
                <div class="hand hour-hand" id="hourHand"></div>
                <div class="hand minute-hand" id="minuteHand"></div>
                <div class="center-pin"></div>
            </div>
        </div>

        <!-- Pèndol i pesos -->
        <div class="pendulum-area">
            <div class="pendulum-rod" id="pendulumRod">
                <div class="pendulum-bob"></div>
            </div>
            <div class="weights-container">
                <div class="weight" id="weightLeft"></div>
                <div class="weight" id="weightRight"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn" id="soundBtn">🔊 So: ON</button>
            <button class="btn" id="themeBtn">🌗 Canviar Ambient</button>
        </div>
    </div>

    <!-- Barra de clima lliscant -->
    <div class="weather-sheet" id="weatherSheet">
        <div class="drag-handle" id="dragHandle"></div>
        <div class="weather-content" id="weatherContent">
            <div class="weather-item"><span>Localitat</span><span id="w-loc">Carregant...</span></div>
            <div class="weather-item"><span>Temperatura</span><span id="w-temp">--°C</span></div>
            <div class="weather-item"><span>Humitat</span><span id="w-hum">--%</span></div>
            <div class="weather-item"><span>Sensació Tèrmica</span><span id="w-feel">--°C</span></div>
            <div class="weather-item"><span>Vent</span><span id="w-wind">-- km/h</span></div>
            <div class="weather-item"><span>Altitud</span><span id="w-alt">-- m</span></div>
            <div class="alert-box" id="w-alert">⚠️ Alerta: Probabilitat alta de pluja</div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓ I ESTAT ---
        let soundEnabled = true;
        let isNight = false;
        let audioCtx = null;
        let pendulumAngle = 0;
        let lastTickTime = 0;
        
        // Elements DOM
        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const clockFace = document.getElementById('clockFace');
        const soundBtn = document.getElementById('soundBtn');
        const themeBtn = document.getElementById('themeBtn');
        const weatherSheet = document.getElementById('weatherSheet');
        const dragHandle = document.getElementById('dragHandle');
        
        // --- 1. GENERAR NÚMEROS ROMANS ---
        function generateNumerals() {
            const numerals = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
            const radius = 75; // Radi per col·locar els números
            numerals.forEach((num, i) => {
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);
                const el = document.createElement('div');
                el.className = 'roman-numeral';
                el.innerText = num;
                el.style.left = `calc(50% + ${x}px)`;
                el.style.top = `calc(50% + ${y}px)`;
                el.style.transform = 'translate(-50%, -50%)';
                clockFace.appendChild(el);
            });
        }

        // --- 2. RELLOTGE I AGULLES ---
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // Moviment de les agulles (suau)
            const minDeg = (minutes + seconds / 60) * 6;
            const hourDeg = ((hours % 12) + minutes / 60) * 30;

            minuteHand.style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            hourHand.style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

            // So de Tic-Tac
            if (soundEnabled && audioCtx) {
                const nowTime = Date.now();
                if (nowTime - lastTickTime > 1000) {
                    playTick();
                    lastTickTime = nowTime;
                }
            }

            // Campanades (simulades cada 15 min per no saturar)
            if (minutes % 15 === 0 && seconds === 0) {
                playChime(minutes === 0 ? hours : 1);
            }

            // Actualitzar ambient si canvia d'hora
            checkDayNight(hours);
        }

        // --- 3. SO (WEB AUDIO API) ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTick() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playChime(count) {
            if (!audioCtx || !soundEnabled) return;
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime); // La 440
                    osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.5);
                    
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.5);
                }, i * 600);
            }
        }

        // --- 4. AMBIENT DIA/NIT I ESTACIONS ---
        function checkDayNight(hours) {
            const isDayTime = hours >= 7 && hours < 19;
            if (isDayTime && isNight) {
                document.body.classList.remove('night');
                isNight = false;
            } else if (!isDayTime && !isNight) {
                document.body.classList.add('night');
                isNight = true;
            }
        }

        function toggleTheme() {
            isNight = !isNight;
            document.body.classList.toggle('night', isNight);
        }

        // --- 5. PESOS ARRASTRABLES ---
        function makeDraggable(el) {
            let startY, startTop;
            const parent = el.parentElement;

            el.addEventListener('mousedown', startDrag);
            el.addEventListener('touchstart', startDrag, {passive: false});

            function startDrag(e) {
                e.preventDefault();
                const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
                startY = clientY;
                // Obtenir posició actual respecte al contenidor
                const rect = el.getBoundingClientRect();
                const parentRect = parent.getBoundingClientRect();
                startTop = rect.top - parentRect.top;

                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, {passive: false});
                document.addEventListener('mouseup', stopDrag);
                document.addEventListener('touchend', stopDrag);
            }

            function drag(e) {
                e.preventDefault();
                const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                const deltaY = clientY - startY;
                let newTop = startTop + deltaY;
                
                // Límit per no pujar més amunt del rellotge
                if (newTop < -80) newTop = -80;
                if (newTop > 0) newTop = 0;

                el.style.transform = `translateY(${newTop}px)`;
            }

            function stopDrag() {
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchend', stopDrag);

                // Efecte de caiguda gradual (simula el pes)
                let currentTop = parseFloat(el.style.transform.replace('translateY(', '').replace('px)', '')) || 0;
                const fallInterval = setInterval(() => {
                    currentTop += 1;
                    if (currentTop >= 0) {
                        currentTop = 0;
                        clearInterval(fallInterval);
                    }
                    el.style.transform = `translateY(${currentTop}px)`;
                }, 100);
            }
        }

        // --- 6. BARRA DE CLIMA LLISCANT ---
        function initWeatherSheet() {
            let startY, startTransform;
            const sheetHeight = 250;
            const closedTransform = 210; // Quant queda visible

            dragHandle.addEventListener('mousedown', startDrag);
            dragHandle.addEventListener('touchstart', startDrag, {passive: false});
            weatherSheet.addEventListener('mousedown', startDrag);
            weatherSheet.addEventListener('touchstart', startDrag, {passive: false});

            function startDrag(e) {
                if (e.target.closest('.weather-content')) return; // No interferir amb el contingut
                e.preventDefault();
                const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
                startY = clientY;
                startTransform = weatherSheet.classList.contains('open') ? 0 : closedTransform;

                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, {passive: false});
                document.addEventListener('mouseup', stopDrag);
                document.addEventListener('touchend', stopDrag);
            }

            function drag(e) {
                e.preventDefault();
                const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                const deltaY = clientY - startY;
                let newTransform = startTransform + deltaY;
                
                if (newTransform < 0) newTransform = 0;
                if (newTransform > closedTransform) newTransform = closedTransform;

                weatherSheet.style.transform = `translateY(${newTransform}px)`;
            }

            function stopDrag() {
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchend', stopDrag);

                const currentTransform = parseFloat(weatherSheet.style.transform.replace('translateY(', '').replace('px)', '')) || 0;
                if (currentTransform < closedTransform / 2) {
                    weatherSheet.classList.add('open');
                    weatherSheet.style.transform = 'translateY(0)';
                } else {
                    weatherSheet.classList.remove('open');
                    weatherSheet.style.transform = `translateY(${closedTransform}px)`;
                }
            }
            
            // Inicialitzar posició
            weatherSheet.style.transform = `translateY(${closedTransform}px)`;
        }

        // --- 7. DADES DEL CLIMA (SIMULADES) ---
        function updateWeather() {
            // Simulem dades aleatòries perquè vegis com funciona
            const temp = (15 + Math.random() * 15).toFixed(1);
            const hum = Math.floor(40 + Math.random() * 50);
            const feel = (parseFloat(temp) - 1 + Math.random() * 2).toFixed(1);
            const wind = (5 + Math.random() * 30).toFixed(0);
            const alt = Math.floor(100 + Math.random() * 500);

            document.getElementById('w-loc').innerText = 'Barcelona (Simulat)';
            document.getElementById('w-temp').innerText = `${temp}°C`;
            document.getElementById('w-hum').innerText = `${hum}%`;
            document.getElementById('w-feel').innerText = `${feel}°C`;
            document.getElementById('w-wind').innerText = `${wind} km/h`;
            document.getElementById('w-alt').innerText = `${alt} m`;

            // Alertes (mostrar només si probabilitat alta)
            const alertBox = document.getElementById('w-alert');
            const rand = Math.random();
            if (rand > 0.8) {
                alertBox.style.display = 'block';
                if (rand > 0.95) alertBox.innerText = '⚠️ Alerta: Risc de Neu';
                else if (rand > 0.9) alertBox.innerText = '⚠️ Alerta: Vent Fort';
                else alertBox.innerText = '⚠️ Alerta: Probabilitat alta de Pluja';
            } else {
                alertBox.style.display = 'none';
            }
        }

        // --- INICIALITZACIÓ ---
        window.onload = () => {
            generateNumerals();
            initWeatherSheet();
            makeDraggable(document.getElementById('weightLeft'));
            makeDraggable(document.getElementById('weightRight'));
            
            // Inicialitzar audio al primer clic (política de navegadors)
            document.body.addEventListener('click', () => {
                initAudio();
            }, { once: true });

            // Botons
            soundBtn.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                soundBtn.innerText = soundEnabled ? '🔊 So: ON' : '🔇 So: OFF';
                if (soundEnabled) initAudio();
            });

            themeBtn.addEventListener('click', toggleTheme);

            // Actualitzacions
            setInterval(updateClock, 1000);
            setInterval(updateWeather, 60000); // Cada minut
            updateWeather(); // Primera càrrega
            updateClock(); // Primera càrrega
            
            // Ambient inicial
            checkDayNight(new Date().getHours());
        };

    </script>
</body>
</html>
